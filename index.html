<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Çağrı Yılmaz — Mobile Development Lead</title>
  <meta name="description" content="Leading mobile development at Vanemar, where technology meets the sea to keep boats smarter and safer." />
  <style>
    :root {
      --bg: #000;
      --fg: #fff;
      --muted: #bfbfbf;
      --ring: rgba(255,255,255,0.2);
      --maxw: 760px;
    }
    html, body { height: 100%; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--fg);
      -webkit-font-smoothing: antialiased;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Apple Color Emoji", "Segoe UI Emoji";
      display: grid;
      grid-template-rows: 1fr auto;
    }
    .wrap {
      display: grid;
      place-items: center;
      padding: 64px 20px 32px;
    }
    .card {
      width: 100%;
      max-width: var(--maxw);
    }
    .avatar {
      width: 112px;
      height: 112px;
      border-radius: 50%;
      object-fit: cover;
      display: block;
      border: 1px solid var(--ring);
      filter: grayscale(100%);
      box-shadow: 0 0 0 6px rgba(255,255,255,0.03);
    }
    header { display: grid; grid-template-columns: 112px 1fr; gap: 24px; align-items: center; }
    @media (max-width: 560px) { header { grid-template-columns: 1fr; justify-items: start; } }

    h1 { font-size: clamp(28px, 5vw, 44px); line-height: 1.1; margin: 0 0 10px; letter-spacing: -0.02em; }
    .subtitle { font-size: clamp(14px, 2.4vw, 18px); color: var(--muted); margin: 0; }
    .subtitle a { color: var(--fg); text-decoration: none; border-bottom: 1px solid var(--ring); }
    .subtitle a:hover { border-bottom-color: var(--fg); }

    .bio { margin: 28px 0 28px; font-size: clamp(15px, 2.8vw, 18px); color: #e9e9e9; max-width: 60ch; }

    .connect-box {
      border: 1px solid var(--ring);
      padding: 12px 16px;
      border-radius: 12px;
      display: inline-flex;
      align-items: center;
      gap: 16px;
    }
    .cta { font-weight: 700; font-size: 18px; margin: 0; }
    .icons { display: flex; gap: 12px; align-items: center; }
    .icon-btn {
      display: inline-flex; align-items: center; justify-content: center;
      width: 44px; height: 44px; border-radius: 999px;
      border: 1px solid var(--ring);
      background: transparent; color: var(--fg);
      transition: transform .15s ease, border-color .15s ease, background-color .15s ease;
      text-decoration: none;
      outline: none;
    }
    .icon-btn:hover { transform: translateY(-1px); border-color: var(--fg); background-color: rgba(255,255,255,0.04); }

    footer { border-top: 1px solid var(--ring); color: var(--muted); font-size: 13px; }
    .footer-inner { max-width: var(--maxw); margin: 0 auto; padding: 16px 20px 28px; display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
    .handle { color: var(--muted); font-size: 14px; }
    .handle a { color: var(--fg); text-decoration: none; border-bottom: 1px solid var(--ring); }
    .handle a:hover { border-bottom-color: var(--fg); }
  </style>
</head>
<body>
  <main class="wrap">
    <section class="card" aria-label="Profile">
      <header>
        <img class="avatar" src="assets/profile.jpg" alt="Portrait of Çağrı Yılmaz" />
        <div>
          <h1>Çağrı Yılmaz</h1>
          <p class="subtitle">Mobile Development Lead at <a href="https://vanemar.com" target="_blank" rel="noopener">Vanemar</a></p>
        </div>
      </header>

      <p class="bio">Leading mobile development at Vanemar, where technology meets the sea to keep boats smarter and safer.</p>

      <div class="connect-box">
        <p class="cta">Let’s connect at</p>
        <nav class="icons" aria-label="Social links">
          <a class="icon-btn" aria-label="X (Twitter)" href="https://x.com/cagriyilmazz" target="_blank" rel="noopener">
            <svg width="20" height="20" viewBox="0 0 1200 1227" aria-hidden="true" fill="currentColor">
              <path d="M714 519 1117 0H967L658 389 407 0H0l423 621L40 1227h150l330-426 268 426h407L714 519Zm-117 150-38-56L206 111H346l210 310 38 56 366 538H820L597 669Z"/>
            </svg>

              <path d="M20.451 20.451h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.447-2.136 2.943v5.663H9.354V9h3.414v1.561h.048c.476-.901 1.637-1.852 3.369-1.852 3.602 0 4.267 2.37 4.267 5.451v6.291zM5.337 7.433a2.062 2.062 0 1 1 0-4.124 2.062 2.062 0 0 1 0 4.124zM7.114 20.451H3.559V9h3.555v11.451z"/>

            </svg>
          </a>
        </nav>
      </div>
    </section>
  </main>

  <footer>
    <div class="footer-inner">
      <span class="handle"><a href="mailto:contact@cagriyilmaz.dev">contact@cagriyilmaz.dev</a></span>
      <span>© <span id="year"></span> Çağrı Yılmaz. All rights reserved.</span>

  </footer>

  <script>
    document.getElementById('year').textContent = new Date().getFullYear();

</body>
</html>
